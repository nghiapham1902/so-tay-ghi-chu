<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sổ Tay — Ghi chú cá nhân</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #0f1115;
      --bg-sidebar: #14171d;
      --bg-list: #181c23;
      --bg-editor: #12151b;
      --bg-surface: #1e232c;
      --bg-hover: #252b36;
      --border: #272d38;
      --text-main: #eef1f6;
      --text-muted: #8c96a6;
      --accent: #6c63ff;
      --accent-hover: #5b52f0;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-app);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: #fff;
    }

    .brand-title { font-size: 15px; font-weight: 700; }
    .brand-sub { font-size: 11px; color: var(--text-muted); }

    .nav-scroll {
      padding: 12px 10px;
      overflow-y: auto;
      flex: 1;
    }

    .section-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 10px 8px 6px;
      text-transform: uppercase;
    }

    .nav-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 2px;
      text-align: left;
    }

    .nav-item:hover { background: var(--bg-hover); }
    .nav-item.active { background: rgba(108, 99, 255, 0.18); color: #fff; font-weight: 600; }

    .nav-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .nav-left span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 11px; color: var(--text-muted); }

    /* Cloud footer */
    .cloud-box {
      padding: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cloud-trigger {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      border-radius: 9px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .cloud-trigger:hover { background: var(--bg-hover); }

    .status-pill {
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 999px;
      font-weight: 600;
      white-space: nowrap;
      background: rgba(140, 150, 166, 0.16);
      color: var(--text-muted);
    }

    .status-pill.connected {
      background: rgba(34, 197, 94, 0.16);
      color: var(--success);
    }

    .status-pill.syncing {
      background: rgba(245, 158, 11, 0.16);
      color: var(--warning);
    }

    .status-pill.error {
      background: rgba(239, 68, 68, 0.16);
      color: var(--danger);
    }

    /* Note list column */
    .note-list-col {
      width: 280px;
      background: var(--bg-list);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .list-header {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .list-header h2 { font-size: 15px; font-weight: 700; }
    .list-count { font-size: 11.5px; color: var(--text-muted); }

    .btn-new {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .btn-new:hover { background: var(--accent-hover); }

    .search-wrap { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      outline: none;
    }

    .notes-scroll { padding: 10px; overflow-y: auto; flex: 1; }

    .note-card {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      margin-bottom: 8px;
      background: rgba(255, 255, 255, 0.015);
    }

    .note-card:hover { background: var(--bg-hover); }
    .note-card.active {
      background: rgba(108, 99, 255, 0.14);
      border-color: rgba(108, 99, 255, 0.45);
    }

    .note-card-title {
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-card-preview {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .note-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Editor area */
    .editor-col {
      flex: 1;
      background: var(--bg-editor);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .cat-pills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .cat-pill {
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .cat-pill.active {
      color: #fff;
      border-color: var(--accent);
      background: rgba(108, 99, 255, 0.22);
    }

    .toolbar {
      padding: 8px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 12.5px;
    }

    .tool-btn, .tool-select {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 12px;
      cursor: pointer;
    }

    .tool-btn:hover { background: var(--bg-hover); }

    .editor-body {
      flex: 1;
      overflow-y: auto;
      padding: 28px 36px;
    }

    .editor-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .title-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 28px;
      font-weight: 700;
      outline: none;
      margin-bottom: 14px;
    }

    .rich-editor {
      min-height: 260px;
      outline: none;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-main);
    }

    .rich-editor table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
    }

    .rich-editor th, .rich-editor td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: 100%;
      max-width: 440px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-header h3 { font-size: 15px; font-weight: 700; }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    .status-banner {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .field-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .row-input {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
    }

    .text-input {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover { background: var(--accent-hover); }

    .hint { font-size: 11.5px; color: var(--text-muted); line-height: 1.45; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M5 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.83a2 2 0 0 0-.59-1.42l-3.83-3.83A2 2 0 0 0 15.17 3H5zm3 6h8v2H8V9zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">Sổ Tay</div>
          <div class="brand-sub">Ghi chú cá nhân</div>
        </div>
      </div>

      <div class="nav-scroll">
        <div class="section-label">Thư viện</div>
        <button class="nav-item active" data-filter="all" onclick="setFilter('all')">
          <div class="nav-left"><span>Tất cả ghi chú</span></div>
          <span class="badge" id="count-all">0</span>
        </button>
        <button class="nav-item" data-filter="pinned" onclick="setFilter('pinned')">
          <div class="nav-left"><span>Đã ghim</span></div>
          <span class="badge" id="count-pinned">0</span>
        </button>
        <button class="nav-item" data-filter="trash" onclick="setFilter('trash')">
          <div class="nav-left"><span>Thùng rác</span></div>
          <span class="badge" id="count-trash">0</span>
        </button>

        <div class="section-label">Nhãn phân loại</div>
        <div id="sidebar-categories"></div>
      </div>
    </div>

    <div class="cloud-box">
      <button class="cloud-trigger" onclick="openCloudModal()">
        <span>Đám mây</span>
        <span class="status-pill syncing" id="sidebar-cloud-status">Đang kết nối...</span>
      </button>
    </div>
  </aside>

  <section class="note-list-col">
    <div class="list-header">
      <div>
        <h2 id="list-heading">Tất cả ghi chú</h2>
        <div class="list-count" id="list-subcount">0 ghi chú</div>
      </div>
      <button class="btn-new" title="Ghi chú mới" onclick="createNote()">+</button>
    </div>
    <div class="search-wrap">
      <input class="search-input" id="search-input" type="text" placeholder="Tìm tiêu đề, nội dung..." oninput="renderNoteList()" />
    </div>
    <div class="notes-scroll" id="notes-list"></div>
  </section>

  <main class="editor-col">
    <div class="topbar">
      <div class="cat-pills" id="editor-cat-pills"></div>
      <div style="display:flex; gap:8px;">
        <button class="tool-btn" id="pin-btn" onclick="togglePin()">Ghim</button>
        <button class="tool-btn" id="trash-btn" onclick="toggleTrash()">Xóa</button>
      </div>
    </div>

    <div class="toolbar">
      <select class="tool-select" onchange="document.execCommand('fontName', false, this.value)">
        <option value="Inter">Inter</option>
        <option value="Georgia">Georgia</option>
        <option value="Courier New">Courier New</option>
      </select>
      <button class="tool-btn" onclick="document.execCommand('bold')"><b>B</b></button>
      <button class="tool-btn" onclick="document.execCommand('italic')"><i>I</i></button>
      <button class="tool-btn" onclick="document.execCommand('underline')"><u>U</u></button>
      <button class="tool-btn" onclick="document.execCommand('formatBlock', false, 'H2')">H2</button>
      <button class="tool-btn" onclick="document.execCommand('insertUnorderedList')">Danh sách</button>
      <button class="tool-btn" onclick="insertTable()">Bảng</button>
    </div>

    <div class="editor-body">
      <div class="editor-meta" id="editor-meta">Chưa chọn ghi chú</div>
      <input class="title-input" id="note-title" type="text" placeholder="Tiêu đề ghi chú..." oninput="onEditorChange()" />
      <div class="rich-editor" id="note-content" contenteditable="true" oninput="onEditorChange()"></div>
    </div>
  </main>

  <!-- Cloud Modal -->
  <div class="modal-backdrop" id="cloud-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Đồng bộ Đám mây Đa Thiết Bị</h3>
        <button class="close-btn" onclick="closeCloudModal()">&times;</button>
      </div>

      <div class="status-banner">
        <div>
          <div style="font-size:13px; font-weight:600;">Trạng thái kết nối</div>
          <div class="hint">Tự động lưu & đồng bộ qua Workspace ID.</div>
        </div>
        <span class="status-pill syncing" id="modal-cloud-status">Đang kết nối...</span>
      </div>

      <label class="field-label" for="workspace-input">Mã đồng bộ không gian (Workspace ID)</label>
      <div class="row-input">
        <input class="text-input" id="workspace-input" type="text" placeholder="Ví dụ: nghia1902" />
        <button class="btn-primary" onclick="connectWorkspace()">Kết nối</button>
      </div>
      <div class="hint">Nhập cùng một Workspace ID trên các thiết bị để dùng chung ghi chú.</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, doc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyD-example-replace-if-needed",
      authDomain: "note-application-7f0a6.firebaseapp.com",
      projectId: "note-application-7f0a6",
      storageBucket: "note-application-7f0a6.appspot.com",
      messagingSenderId: "000000000000",
      appId: "1:000000000000:web:000000000000"
    };

    const CATEGORIES = [
      { id: 'ideas', name: 'Ý tưởng', color: '#f59e0b' },
      { id: 'personal', name: 'Cá nhân', color: '#ec4899' },
      { id: 'study', name: 'Học tập', color: '#6366f1' },
      { id: 'work', name: 'Công việc', color: '#3b82f6' },
      { id: 'machine', name: 'Machine', color: '#10b981' }
    ];

    const STORAGE_NOTES_KEY = 'sotay_notes_v1';
    const STORAGE_WS_KEY = 'sotay_workspace_id_v1';

    let state = {
      notes: loadLocalNotes(),
      activeNoteId: null,
      filter: 'all',
      workspaceId: localStorage.getItem(STORAGE_WS_KEY) || 'nghia1902',
      cloudStatus: 'syncing',
      cloudLabel: 'Đang kết nối...'
    };

    let db = null;
    let auth = null;
    let unsubscribeDoc = null;
    let saveTimer = null;

    function loadLocalNotes() {
      try {
        const raw = localStorage.getItem(STORAGE_NOTES_KEY);
        if (raw) return JSON.parse(raw);
      } catch (_) {}
      return [{
        id: 'welcome-note',
        title: 'Chào mừng đến với Sổ Tay Đám Mây',
        content: '<p>Ghi chú của bạn sẽ được lưu cục bộ và đồng bộ theo Workspace ID.</p>',
        category: 'work',
        pinned: true,
        trashed: false,
        updatedAt: Date.now()
      }];
    }

    function saveLocalNotes() {
      localStorage.setItem(STORAGE_NOTES_KEY, JSON.stringify(state.notes));
    }

    function setCloudStatus(status, label) {
      state.cloudStatus = status;
      state.cloudLabel = label;
      ['sidebar-cloud-status', 'modal-cloud-status'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = label;
        el.className = `status-pill ${status}`;
      });
    }

    function renderCategoryIcon(color) {
      return `<svg width="13" height="13" viewBox="0 0 24 24" fill="${color}" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>`;
    }

    function renderSidebarCategories() {
      const wrap = document.getElementById('sidebar-categories');
      wrap.innerHTML = CATEGORIES.map(cat => {
        const count = state.notes.filter(n => !n.trashed && n.category === cat.id).length;
        const active = state.filter === `cat:${cat.id}` ? 'active' : '';
        return `
          <button class="nav-item ${active}" onclick="setFilter('cat:${cat.id}')">
            <div class="nav-left">${renderCategoryIcon(cat.color)}<span>${cat.name}</span></div>
            <span class="badge">${count}</span>
          </button>
        `;
      }).join('');
    }

    function renderCounts() {
      document.getElementById('count-all').textContent = state.notes.filter(n => !n.trashed).length;
      document.getElementById('count-pinned').textContent = state.notes.filter(n => !n.trashed && n.pinned).length;
      document.getElementById('count-trash').textContent = state.notes.filter(n => n.trashed).length;
      renderSidebarCategories();
    }

    function getFilteredNotes() {
      const q = (document.getElementById('search-input').value || '').trim().toLowerCase();
      return state.notes
        .filter(n => {
          if (state.filter === 'trash') return n.trashed;
          if (n.trashed) return false;
          if (state.filter === 'pinned') return n.pinned;
          if (state.filter.startsWith('cat:')) return n.category === state.filter.slice(4);
          return true;
        })
        .filter(n => {
          if (!q) return true;
          const plain = (n.content || '').replace(/<[^>]+>/g, ' ').toLowerCase();
          return (n.title || '').toLowerCase().includes(q) || plain.includes(q);
        })
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    }

    window.renderNoteList = function() {
      renderCounts();
      const listEl = document.getElementById('notes-list');
      const items = getFilteredNotes();
      document.getElementById('list-subcount').textContent = `${items.length} ghi chú`;

      if (!state.activeNoteId && items.length > 0) {
        state.activeNoteId = items[0].id;
      }

      listEl.innerHTML = items.map(n => {
        const preview = (n.content || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
        const active = n.id === state.activeNoteId ? 'active' : '';
        return `
          <div class="note-card ${active}" onclick="selectNote('${n.id}')">
            <div class="note-card-title">${escapeHtml(n.title || 'Ghi chú chưa đặt tên')}</div>
            <div class="note-card-preview">${escapeHtml(preview || 'Chưa có nội dung')}</div>
            <div class="note-card-meta">
              <span>${n.pinned ? 'Đã ghim' : ''}</span>
              <span>${formatTime(n.updatedAt)}</span>
            </div>
          </div>
        `;
      }).join('') || `<div class="hint" style="padding:12px;">Không có ghi chú phù hợp.</div>`;

      renderEditor();
    };

    function renderEditor() {
      const note = state.notes.find(n => n.id === state.activeNoteId);
      const pillsWrap = document.getElementById('editor-cat-pills');
      pillsWrap.innerHTML = CATEGORIES.map(cat => {
        const active = note && note.category === cat.id ? 'active' : '';
        return `
          <button class="cat-pill ${active}" onclick="setNoteCategory('${cat.id}')">
            ${renderCategoryIcon(cat.color)}<span>${cat.name}</span>
          </button>
        `;
      }).join('');

      const titleInput = document.getElementById('note-title');
      const contentDiv = document.getElementById('note-content');
      const metaDiv = document.getElementById('editor-meta');
      const pinBtn = document.getElementById('pin-btn');
      const trashBtn = document.getElementById('trash-btn');

      if (!note) {
        titleInput.value = '';
        contentDiv.innerHTML = '';
        metaDiv.textContent = 'Chưa chọn ghi chú';
        pinBtn.textContent = 'Ghim';
        trashBtn.textContent = 'Xóa';
        return;
      }

      if (document.activeElement !== titleInput) {
        titleInput.value = note.title || '';
      }
      if (document.activeElement !== contentDiv && contentDiv.innerHTML !== (note.content || '')) {
        contentDiv.innerHTML = note.content || '';
      }

      const words = (note.content || '').replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
      metaDiv.textContent = `Cập nhật ${formatTime(note.updatedAt)} • ${words} từ`;
      pinBtn.textContent = note.pinned ? 'Bỏ ghim' : 'Ghim';
      trashBtn.textContent = note.trashed ? 'Khôi phục' : 'Xóa';
    }

    window.setFilter = function(filter) {
      state.filter = filter;
      document.querySelectorAll('.nav-item[data-filter]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      const headingMap = {
        all: 'Tất cả ghi chú',
        pinned: 'Đã ghim',
        trash: 'Thùng rác'
      };
      const catObj = filter.startsWith('cat:') ? CATEGORIES.find(c => c.id === filter.slice(4)) : null;
      document.getElementById('list-heading').textContent = catObj ? catObj.name : (headingMap[filter] || 'Ghi chú');
      state.activeNoteId = null;
      renderNoteList();
    };

    window.selectNote = function(id) {
      state.activeNoteId = id;
      renderNoteList();
    };

    window.createNote = function() {
      const catId = state.filter.startsWith('cat:') ? state.filter.slice(4) : 'work';
      const newNote = {
        id: 'note_' + Date.now(),
        title: '',
        content: '',
        category: catId,
        pinned: false,
        trashed: false,
        updatedAt: Date.now()
      };
      state.notes.unshift(newNote);
      state.activeNoteId = newNote.id;
      saveLocalNotes();
      renderNoteList();
      scheduleCloudPush();
      document.getElementById('note-title').focus();
    };

    window.onEditorChange = function() {
      const note = state.notes.find(n => n.id === state.activeNoteId);
      if (!note) return;
      note.title = document.getElementById('note-title').value;
      note.content = document.getElementById('note-content').innerHTML;
      note.updatedAt = Date.now();
      saveLocalNotes();
      renderNoteList();
      scheduleCloudPush();
    };

    window.setNoteCategory = function(catId) {
      const note = state.notes.find(n => n.id === state.activeNoteId);
      if (!note) return;
      note.category = catId;
      note.updatedAt = Date.now();
      saveLocalNotes();
      renderNoteList();
      scheduleCloudPush();
    };

    window.togglePin = function() {
      const note = state.notes.find(n => n.id === state.activeNoteId);
      if (!note) return;
      note.pinned = !note.pinned;
      note.updatedAt = Date.now();
      saveLocalNotes();
      renderNoteList();
      scheduleCloudPush();
    };

    window.toggleTrash = function() {
      const note = state.notes.find(n => n.id === state.activeNoteId);
      if (!note) return;
      note.trashed = !note.trashed;
      note.updatedAt = Date.now();
      state.activeNoteId = null;
      saveLocalNotes();
      renderNoteList();
      scheduleCloudPush();
    };

    window.insertTable = function() {
      const html = '<table><tr><th>Cột 1</th><th>Cột 2</th></tr><tr><td>Nội dung</td><td>Nội dung</td></tr></table><p><br></p>';
      document.execCommand('insertHTML', false, html);
      onEditorChange();
    };

    window.openCloudModal = function() {
      document.getElementById('workspace-input').value = state.workspaceId;
      document.getElementById('cloud-modal').classList.add('open');
    };

    window.closeCloudModal = function() {
      document.getElementById('cloud-modal').classList.remove('open');
    };

    window.connectWorkspace = function() {
      const inputVal = (document.getElementById('workspace-input').value || '').trim();
      const wsId = inputVal || 'nghia1902';
      state.workspaceId = wsId;
      localStorage.setItem(STORAGE_WS_KEY, wsId);
      subscribeWorkspace(wsId);
    };

    function scheduleCloudPush() {
      if (!db || !auth?.currentUser || !state.workspaceId) return;
      setCloudStatus('syncing', 'Đang lưu...');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          const ref = doc(db, 'workspaces', state.workspaceId);
          await setDoc(ref, { notes: state.notes, updatedAt: Date.now() }, { merge: true });
          setCloudStatus('connected', 'Đã đồng bộ');
        } catch (err) {
          console.error(err);
          setCloudStatus('error', 'Lỗi kết nối');
        }
      }, 450);
    }

    function subscribeWorkspace(wsId) {
      if (!db || !auth?.currentUser) return;
      if (unsubscribeDoc) {
        unsubscribeDoc();
        unsubscribeDoc = null;
      }
      setCloudStatus('syncing', 'Đang đồng bộ...');
      const ref = doc(db, 'workspaces', wsId);
      unsubscribeDoc = onSnapshot(ref, async (snap) => {
        try {
          if (snap.exists() && Array.isArray(snap.data().notes)) {
            state.notes = snap.data().notes;
            saveLocalNotes();
            renderNoteList();
          } else {
            await setDoc(ref, { notes: state.notes, updatedAt: Date.now() }, { merge: true });
          }
          setCloudStatus('connected', 'Đã đồng bộ');
        } catch (e) {
          console.error(e);
          setCloudStatus('error', 'Lỗi kết nối');
        }
      }, (err) => {
        console.error(err);
        setCloudStatus('error', 'Lỗi kết nối');
      });
    }

    function initFirebase() {
      try {
        const app = initializeApp(FIREBASE_CONFIG);
        auth = getAuth(app);
        db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
          if (user) {
            subscribeWorkspace(state.workspaceId);
          } else {
            setCloudStatus('syncing', 'Đang xác thực...');
          }
        });

        signInAnonymously(auth).catch((err) => {
          console.error(err);
          setCloudStatus('error', 'Lỗi kết nối');
        });
      } catch (err) {
        console.error(err);
        setCloudStatus('error', 'Lỗi kết nối');
      }
    }

    function formatTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ' + d.toLocaleDateString('vi-VN');
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }

    document.getElementById('workspace-input').value = state.workspaceId;
    renderNoteList();
    initFirebase();
  </script>
</body>
</html>
